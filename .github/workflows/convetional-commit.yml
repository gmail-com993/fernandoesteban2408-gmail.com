name: 'Conventional Commit'

# Declare default permissions as read only.
permissions: read-all

on:
  pull_request_target:
    types:
      # Defaults
      # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request_target
      - opened
      - reopened
      - synchronize
      # Tracks editing PR title or description, or base branch changes
      # https://docs.github.com/en/webhooks/webhook-events-and-payloads?actionType=edited#pull_request
      - edited

jobs:
  main:
    name: '[Required] Validate PR title'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
